services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: shubham-portfolio:latest
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_TO=${EMAIL_TO:-sharmashubham99745@gmail.com}
